<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赤白酒場｜ドリンク80円〜 焼き鳥1本90円〜</title>
  <!-- 主にGoogleなどの検索結果で、タイトルの下に表示される紹介文として使われるメタディスクリプション -->
  <meta name="description" content="仕事帰りに安く飲める焼き鳥酒場。ドリンク80円〜、焼き鳥1本90円〜。16:00〜24:00営業、水曜定休。">

  <!-- ===== OGP（SNSでシェアされた時の表示） =====
     ※og:url と og:image は「https://〜」から始まる絶対URLで指定 -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="赤白酒場">
  <meta property="og:title" content="ひとりでも気軽に！16時〜24時営業赤白酒場">
  <meta property="og:description"
    content="ドリンク1杯80円〜*！焼き鳥は1本90円〜。仕事帰りの一杯に、今夜はここで決まり！(水曜定休日)　*ハッピーアワー(平日16:00~20:00)の価格です。">
  <meta property="og:url" content="https://wadamiari.github.io/kouhakusakaba/">
  <meta property="og:image" content="https://wadamiari.github.io/kouhakusakaba/images/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="赤白酒場のロゴと、焼き台で焼き鳥を焼く店主">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 見出し・ロゴ用の明朝体（Google Fonts） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- ===== ヘッダー（右側に「地図を開く」ボタンを常時表示） ===== -->
  <header>
    <div class="head">
      <div class="head-left">
        <h1 class="site-title"><a class="logo" href="#top">赤白酒場</a></h1>
        <p class="badge" id="status" role="status">営業状況を確認中…</p>
      </div>
      <a class="head-map" data-route href="#" target="_blank" rel="noopener">地図を開く</a>
    </div>
  </header>

  <main id="top">

    <!-- ===== 1. ファーストビュー（写真＋キャッチコピー） ===== -->
    <section class="fv" aria-label="メインビジュアル">
      <p class="fv-copy">仕事帰りの、<br>安くてうまい一杯</p>
    </section>

    <!-- ===== 2. 安心の3点（壁に掛けた木札メニュー風・縦書き） ===== -->
    <section class="strip" aria-label="安心ポイント">
      <ul>
        <li><span><span class="em">1杯</span>からOK</span></li>
        <li><span><span class="em">おひとり様</span>歓迎</span></li>
        <li><span>焼き鳥<span class="em">1本</span>から<br>注文OK</span></li>
      </ul>
    </section>

    <!-- ===== 3 お知らせ画像（ハッピーアワー／焼き鳥／セット） ===== -->
    <section class="promo" aria-label="おすすめ">
      <h2 data-en="RECOMMEND">おすすめ</h2>
      <div class="promo-list">
        <img src="images/happyhour-1280.jpg" width="1280" height="720" loading="lazy" alt="ハッピーアワー開催中！ハイボール・レモン酎ハイ 1杯80円〜">
        <img src="images/menu-1280.jpg" width="1280" height="721" loading="lazy"
          alt="焼き鳥1本90円。ひね鶏たたき680円、唐揚げ480円、フライドポテト380円">
        <img src="images/senbero-1280.jpg" width="1280" height="853" loading="lazy"
          alt="ちょい飲みセット290円（ドリンク1杯＋焼き鳥2本）、ほろよいセット590円（ドリンク2杯＋焼き鳥3本）、せんべろセット990円（ドリンク2杯＋焼き鳥3本＋ミニ一品）">
      </div>
      <!-- スライドの位置を示す丸（中身はJSで画像の枚数分つくる） -->
      <div class="promo-dots" aria-label="おすすめ画像の切り替え"></div>
      <p class="promo-note">
        ※表示価格はすべて税込です。<br>
        ※ハッピーアワーは平日16:00~20:00。
      </p>
    </section>

    <!-- ===== 4 店舗情報 ===== -->
    <section id="info" class="info">
      <div class="inner">
        <h2 data-en="SHOP INFO">店舗情報</h2>
        <div class="info-body">
          <dl class="info-list">
            <dt>住所</dt>
            <dd><span data-bind="address"></span>　<span data-bind="station"></span>徒歩<span data-bind="walk"></span>分
            </dd>
            <dt>電話</dt>
            <dd><a data-tel data-bind="tel" href="#"></a></dd>
            <dt>営業時間</dt>
            <dd>16:00〜24:00（ラストオーダー 23:30）</dd>
            <dt>定休日</dt>
            <dd>水曜日</dd>
            <dt>喫煙</dt>
            <dd>店内全席喫煙可<br><small class="info-note">※20歳未満の方は入店できません</small></dd>
            <dt>お支払い</dt>
            <dd>クレジットカード可（Visa, JCB）<br>電子マネー不可</dd>
            <dt>Instagram</dt>
            <dd><a data-insta href="#" target="_blank" rel="noopener">@<span data-bind="insta"></span></a></dd>
          </dl>
          <div class="info-photos">
            <img src="images/izakaya1-1200.jpg" width="1200" height="675" loading="lazy"
              alt="店内のテーブル席。木のテーブルが並び、壁に焼き鳥メニューの木札">
            <img src="images/izakaya2-1200.jpg" width="1200" height="675" loading="lazy" alt="店内のカウンター席と厨房、奥に並ぶテーブル席">
          </div>
        </div>
        <div class="btns">
          <a class="btn btn-map" data-route href="#" target="_blank" rel="noopener">地図を開く</a>
          <a class="btn btn-tel" data-tel href="#">ご予約・お電話</a>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== フッター ===== -->
  <footer>
    <div class="inner">
      <p class="copy">© <span data-bind="name"></span></p>
    </div>
  </footer>

  <!-- ===== スクリプト（店舗情報・営業状況・お知らせスライド） ===== -->
  <script src="./js/main.js"></script>
</body>

</html>
